name: Build & deploy docs site

on:
  push:
    branches:
      - main
  # The mirror steps can now fail the build, so run it before merge rather than
  # discovering a broken mirror only after it has been deployed. The deploy job's
  # gates require github.ref == refs/heads/main, which a pull_request run never is,
  # so this builds and publishes nothing.
  pull_request:
    branches:
      - main
  # A release in the harness repo refreshes the mirrored get-agro.sh, get-oh.sh,
  # agro.js, and oh.js without anyone having to remember to push to this repo.
  # Both event types carry client_payload.ref. Sending the dispatch is a follow-up
  # on the harness side and is not part of this repo's diff.
  repository_dispatch:
    types: [agro-release, openharness-release]
  # Backstop: the mirror going stale is invisible until someone installs, so rebuild
  # daily even if no dispatch arrives.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "harness ref to mirror (default: main)"
        required: false
        default: "main"

permissions:
  contents: read
  pages: write
  id-token: write

env:
  OH_SCRIPTS_REF: >-
    ${{ github.event.client_payload.ref || inputs.ref || 'main' }}

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    concurrency:
      group: docs-site-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22.x
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test the mirror failure classification
        run: pnpm test

      # Drift is caught before it lands, not after. This deliberately does NOT gate
      # the deploy: a stale doc line is worth less than a stale oh.js, and blocking
      # the scheduled rebuild would leave the mirror behind to punish a prose typo.
      - name: Check docs and promos for retired references
        if: github.event_name == 'pull_request'
        run: pnpm run check:docs-drift

      - name: Build site
        run: pnpm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && contains(fromJSON('["mifunedev/agro-web", "mifunedev/openharness-web"]'), github.repository)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && contains(fromJSON('["mifunedev/agro-web", "mifunedev/openharness-web"]'), github.repository)
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && contains(fromJSON('["mifunedev/agro-web", "mifunedev/openharness-web"]'), github.repository)
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
